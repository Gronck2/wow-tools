[[privacy]]
head = "Zwei Netzwerkabfragen, nichts über Sie."
text = "GitHub einmal am Tag nach einer neuen Version von WoW Tools (abschaltbar) und tukui.org für ElvUI, wenn es installiert ist."

[[privacy]]
head = "Das Spiel bleibt unberührt."
text = "Kein Lesen des Spielspeichers, keine Automatisierung im Spiel."

[[privacy]]
head = "Erst eine Sicherung."
text = "Alles, was Einstellungen oder Addons ändert – Wiederherstellen, Kopieren, Aufräumen, Profile, Addon-Updates –, sichert vorher den aktuellen Stand."

[[faq]]
q = "Was brauche ich?"
a = "Windows 10 oder 11, 64 Bit, und World of Warcraft, installiert über Battle.net. Für Addon-Updates eines der Programme CurseForge, WowUp, WowUp-CF oder die Wago App, eingerichtet. Sicherungen, Wiederherstellen und Kopieren funktionieren auch ohne sie."

[[faq]]
q = "Kann man mehrere Addon-Programme gleichzeitig nutzen?"
a = "Nein, mit Absicht: Zwei Manager über einem AddOns-Ordner machen sich gegenseitig die Addons kaputt. WoW Tools arbeitet mit dem, den Sie wählen."

[[faq]]
q = "Kopierte Tastenbelegungen sind nach dem Einloggen weg."
a = 'Tastenbelegung und Makros werden eventuell mit dem Server synchronisiert, und das kann kopierte Dateien überschreiben. Wie man das abschaltet, steht in der <a href="https://github.com/Gronck2/wow-tools/blob/main/README.de.md#einstellungen-zwischen-charakteren-kopieren">README</a>.'

[[faq]]
q = "Wo findet es das Spiel?"
a = "In der Registry, in der Installationsliste von Battle.net und dann an den üblichen Orten. Spielversionen in anderen Ordnern werden ebenfalls gefunden; sonst legen Sie den Ordner unter „Einstellungen → Allgemein“ fest."

[[faq]]
q = "Ist es kostenlos?"
a = "Ja. Open Source unter MIT oder Apache-2.0, ohne Werbung und ohne Konto."
