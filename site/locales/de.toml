[[features]]
title = "Sicherungen"
text = '<code>WTF</code> (Tastenbelegung, Makros, Chat, CVars, Addon-Einstellungen) und <code>Interface\AddOns</code> – nach jeder Spielsitzung oder nach Zeitplan.'

[[features]]
title = "Wiederherstellen mit einem Klick"
text = "Auf jeden früheren Stand. Der aktuelle Stand wird vorher gesichert, sodass sich jede Wiederherstellung rückgängig machen lässt."

[[features]]
title = "Addon-Updates"
text = "Über den Addon-Manager, den Sie ohnehin nutzen – CurseForge, WowUp, WowUp-CF oder die Wago App –, ohne Fenster, nach Zeitplan und nie, während Sie spielen. ElvUI direkt von seiner offiziellen Website."

[[features]]
title = "Spiel-Patches"
text = "Aktualisiert Battle.net das Spiel, werden Einstellungen und Addons vor dem ersten Start auf der neuen Version gesichert, und Sie sehen, welche Addons noch nicht dafür gemacht sind."

[[features]]
title = "UI-Profile"
text = "Die Oberfläche eines Charakters speichern – Tastenbelegung, Makros, Layout, Addons und ihre Profile – und mit zwei Klicks einem anderen Charakter geben."

[[features]]
title = "Zwischen Charakteren kopieren"
text = "Tastenbelegung, Makros, Chatfenster, Fensteranordnung, aktivierte Addons und Addon-Einstellungen von einem Charakter auf andere."

[[features]]
title = "Aufräumen"
text = "Einstellungen entfernter Addons, die <code>.bak</code>-Kopien von WoW, alte Kampflogs, Screenshots und der Cache – mit Größenangaben, mit einem Klick."

[[features]]
title = "Aktualisiert sich selbst"
text = "Fragt einmal am Tag bei GitHub nach und installiert eine neue Version mit einem Klick. Jeder Download wird mit seiner SHA-256-Prüfsumme abgeglichen."

[[features]]
title = "Fünf Sprachen"
text = "Deutsch, Englisch, Russisch, Französisch und Spanisch. Folgt dem hellen oder dunklen Design von Windows und seiner Akzentfarbe."

