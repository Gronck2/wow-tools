[[features]]
title = "Sauvegardes"
text = '<code>WTF</code> (raccourcis clavier, macros, discussion, CVars, réglages des addons) et <code>Interface\AddOns</code> — après chaque session de jeu ou selon un planning.'

[[features]]
title = "Restauration en un clic"
text = "Vers n'importe quel point antérieur. L'état actuel est d'abord enregistré : une restauration peut toujours être annulée."

[[features]]
title = "Mise à jour des addons"
text = "Via le gestionnaire que vous utilisez déjà — CurseForge, WowUp, WowUp-CF ou Wago App —, sans fenêtre, selon un planning, jamais pendant que vous jouez. ElvUI directement depuis son site officiel."

[[features]]
title = "Patchs du jeu"
text = "Quand Battle.net met le jeu à jour, les réglages et les addons sont sauvegardés avant le premier lancement sur la nouvelle version, et vous voyez quels addons ne sont pas encore faits pour elle."

[[features]]
title = "Profils d'interface"
text = "Enregistrez l'interface d'un personnage — raccourcis, macros, disposition, addons et leurs profils — et appliquez-la à un autre personnage en deux clics."

[[features]]
title = "Copie entre personnages"
text = "Raccourcis, macros, fenêtres de discussion, disposition des cadres, addons activés et réglages des addons, d'un personnage vers d'autres."

[[features]]
title = "Nettoyage"
text = "Réglages d'addons supprimés, copies <code>.bak</code> de WoW, vieux journaux de combat, captures d'écran et cache — avec leur taille, en un clic."

[[features]]
title = "Se met à jour seul"
text = "Vérifie GitHub une fois par jour et installe une nouvelle version en un clic. Chaque téléchargement est contrôlé avec son empreinte SHA-256."

[[features]]
title = "Cinq langues"
text = "Français, anglais, russe, allemand et espagnol. Suit le thème clair ou sombre de Windows et sa couleur d'accentuation."

