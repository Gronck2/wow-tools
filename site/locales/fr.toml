[[privacy]]
head = "Deux requêtes réseau, rien sur vous."
text = "GitHub une fois par jour pour une nouvelle version de WoW Tools (désactivable), et tukui.org pour ElvUI quand il est installé."

[[privacy]]
head = "Ne touche jamais au jeu."
text = "Il ne lit pas la mémoire du jeu et n'automatise rien en jeu."

[[privacy]]
head = "D'abord une sauvegarde."
text = "Tout ce qui modifie les réglages ou les addons — restauration, copie, nettoyage, profils, mises à jour d'addons — enregistre d'abord l'état actuel."

[[faq]]
q = "De quoi ai-je besoin ?"
a = "Windows 10 ou 11, 64 bits, et World of Warcraft installé via Battle.net. Pour mettre à jour les addons : CurseForge, WowUp, WowUp-CF ou Wago App, configuré. Les sauvegardes, la restauration et la copie fonctionnent sans eux."

[[faq]]
q = "Peut-on utiliser plusieurs programmes d'addons à la fois ?"
a = "Non, exprès : deux gestionnaires sur un même dossier AddOns cassent les addons l'un de l'autre. WoW Tools travaille avec celui que vous choisissez."

[[faq]]
q = "Les raccourcis copiés ont disparu après la connexion."
a = 'Les raccourcis et les macros peuvent être synchronisés avec le serveur, ce qui peut écraser les fichiers copiés. Le <a href="https://github.com/Gronck2/wow-tools/blob/main/README.fr.md#copier-les-réglages-entre-personnages">README</a> explique comment le désactiver.'

[[faq]]
q = "Où trouve-t-il le jeu ?"
a = "Dans le registre, la liste des installations de Battle.net, puis aux emplacements habituels. Les versions du jeu installées dans d'autres dossiers sont trouvées aussi ; sinon, indiquez le dossier dans « Paramètres → Général »."

[[faq]]
q = "Est-ce gratuit ?"
a = "Oui. Open source sous MIT ou Apache-2.0, sans publicité et sans compte."
