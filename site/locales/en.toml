[[privacy]]
head = "Two network requests, nothing about you."
text = "GitHub once a day for a new version of WoW Tools (can be switched off), and tukui.org for ElvUI when it is installed."

[[privacy]]
head = "Never touches the game."
text = "It does not read game memory and does not automate anything in game."

[[privacy]]
head = "A snapshot comes first."
text = "Whatever changes settings or addons — restore, copying, cleanup, profiles, addon updates — saves the current state before it starts."

[[faq]]
q = "What do I need?"
a = "Windows 10 or 11, 64-bit, and World of Warcraft installed through Battle.net. For addon updates — one of CurseForge, WowUp, WowUp-CF or the Wago App, set up. Backups, restore and copying work without them."

[[faq]]
q = "Can several addon programs be used at once?"
a = "No, on purpose: two managers over one AddOns folder break each other's addons. WoW Tools works with the one you choose."

[[faq]]
q = "Copied bindings disappeared after login."
a = "Bindings and macros may be synchronised with the server, which can override copied files. The <a href=\"https://github.com/Gronck2/wow-tools#copying-settings-between-characters\">README</a> shows how to switch that off."

[[faq]]
q = "Where does it find the game?"
a = "The registry, Battle.net's install list, then the usual paths. Game versions installed in other folders are found too; otherwise set the folder in Settings → General."

[[faq]]
q = "Is it free?"
a = "Yes. Open source under MIT or Apache-2.0, no ads, no accounts."
