[[features]]
title = "Backups"
text = "<code>WTF</code> (bindings, macros, chat, CVars, addon settings) and <code>Interface\\AddOns</code> — after every game session or on a schedule."

[[features]]
title = "One-click restore"
text = "Back to any earlier point. The current state is saved first, so a restore can always be undone."

[[features]]
title = "Addon updates"
text = "Through the manager you already use — CurseForge, WowUp, WowUp-CF or the Wago App — without a window, on a schedule, never while you play. ElvUI straight from its official site."

[[features]]
title = "Game patches"
text = "When Battle.net patches the game, settings and addons are saved before the first start on the new version, and you see which addons are not made for it yet."

[[features]]
title = "UI profiles"
text = "Save a character's interface — bindings, macros, layout, addons and their profiles — and put it on another character in two clicks."

[[features]]
title = "Copy between characters"
text = "Bindings, macros, chat windows, frame layout, enabled addons and addon settings from one character to others."

[[features]]
title = "Cleanup"
text = "Settings of removed addons, WoW's <code>.bak</code> copies, old combat logs, screenshots and the cache — with sizes, in one click."

[[features]]
title = "Updates itself"
text = "Checks GitHub once a day and installs a new version in one click. Each download is checked against its SHA-256."

[[features]]
title = "Five languages"
text = "English, Russian, German, French and Spanish. Follows the Windows light or dark theme and accent colour."

