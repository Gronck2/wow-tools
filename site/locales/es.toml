[[features]]
title = "Copias de seguridad"
text = '<code>WTF</code> (atajos de teclado, macros, chat, CVars, configuración de addons) e <code>Interface\AddOns</code>: tras cada sesión de juego o de forma programada.'

[[features]]
title = "Restauración con un clic"
text = "A cualquier punto anterior. Antes se guarda el estado actual, así que una restauración siempre se puede deshacer."

[[features]]
title = "Actualización de addons"
text = "Con el gestor que ya usas (CurseForge, WowUp, WowUp-CF o Wago App), sin ventana, de forma programada y nunca mientras juegas. ElvUI directamente desde su web oficial."

[[features]]
title = "Parches del juego"
text = "Cuando Battle.net actualiza el juego, la configuración y los addons se guardan antes del primer inicio con la nueva versión, y ves qué addons aún no están hechos para ella."

[[features]]
title = "Perfiles de interfaz"
text = "Guarda la interfaz de un personaje (atajos, macros, disposición, addons y sus perfiles) y aplícala a otro personaje en dos clics."

[[features]]
title = "Copia entre personajes"
text = "Atajos, macros, ventanas de chat, disposición de marcos, addons activados y su configuración, de un personaje a otros."

[[features]]
title = "Limpieza"
text = "Configuración de addons eliminados, copias <code>.bak</code> de WoW, registros de combate antiguos, capturas de pantalla y la caché, con sus tamaños, en un clic."

[[features]]
title = "Se actualiza solo"
text = "Consulta GitHub una vez al día e instala una nueva versión con un clic. Cada descarga se comprueba con su SHA-256."

[[features]]
title = "Cinco idiomas"
text = "Español, inglés, ruso, alemán y francés. Sigue el tema claro u oscuro de Windows y su color de énfasis."

