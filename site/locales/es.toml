[[privacy]]
head = "Dos consultas de red, nada sobre ti."
text = "GitHub una vez al día, por si hay una nueva versión de WoW Tools (se puede desactivar), y tukui.org para ElvUI si está instalado."

[[privacy]]
head = "Nunca toca el juego."
text = "No lee la memoria del juego y no automatiza nada dentro del juego."

[[privacy]]
head = "Primero, una instantánea."
text = "Todo lo que cambia la configuración o los addons (restaurar, copiar, limpiar, perfiles, actualizar addons) guarda antes el estado actual."

[[faq]]
q = "¿Qué necesito?"
a = "Windows 10 u 11, de 64 bits, y World of Warcraft instalado con Battle.net. Para actualizar addons, uno de CurseForge, WowUp, WowUp-CF o Wago App, configurado. Las copias, la restauración y la copia entre personajes funcionan sin ellos."

[[faq]]
q = "¿Se pueden usar varios programas de addons a la vez?"
a = "No, a propósito: dos gestores sobre una misma carpeta AddOns se rompen los addons entre sí. WoW Tools trabaja con el que elijas."

[[faq]]
q = "Los atajos copiados desaparecieron al entrar en el juego."
a = 'Los atajos y las macros pueden sincronizarse con el servidor, y eso puede sobrescribir los archivos copiados. El <a href="https://github.com/Gronck2/wow-tools/blob/main/README.es.md#copiar-la-configuración-entre-personajes">README</a> explica cómo desactivarlo.'

[[faq]]
q = "¿Dónde encuentra el juego?"
a = "En el registro, en la lista de instalaciones de Battle.net y luego en las rutas habituales. También encuentra versiones del juego instaladas en otras carpetas; si no, indica la carpeta en «Configuración → General»."

[[faq]]
q = "¿Es gratis?"
a = "Sí. Código abierto bajo MIT o Apache-2.0, sin anuncios y sin cuentas."
