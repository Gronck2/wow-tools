[[privacy]]
head = "Два сетевых запроса, ничего о вас."
text = "GitHub раз в день — нет ли новой версии WoW Tools (можно выключить), и tukui.org за ElvUI, если он установлен."

[[privacy]]
head = "Не трогает игру."
text = "Не читает память игры и ничего не автоматизирует в игре."

[[privacy]]
head = "Сначала снапшот."
text = "Всё, что меняет настройки или аддоны, — восстановление, копирование, уборка, профили, обновление аддонов — сперва сохраняет текущее состояние."

[[faq]]
q = "Что нужно для работы?"
a = "Windows 10 или 11, 64-бит, и World of Warcraft, установленный через Battle.net. Для обновления аддонов — одна из программ CurseForge, WowUp, WowUp-CF или Wago App, настроенная. Бэкапы, восстановление и копирование работают и без них."

[[faq]]
q = "Можно ли пользоваться несколькими программами для аддонов сразу?"
a = "Нет, и это намеренно: два менеджера над одной папкой AddOns ломают друг другу аддоны. WoW Tools работает с тем, который вы выберете."

[[faq]]
q = "Скопированные бинды пропали после входа в игру."
a = 'Бинды и макросы могут синхронизироваться с сервером и перезаписывать скопированные файлы. Как это выключить — в <a href="https://github.com/Gronck2/wow-tools/blob/main/README.ru.md#копирование-настроек-между-персонажами">README</a>.'

[[faq]]
q = "Как он находит игру?"
a = "Реестр, список установок Battle.net, затем обычные пути. Версии игры в других папках тоже находятся; иначе папку можно указать в «Настройки → Общие»."

[[faq]]
q = "Это бесплатно?"
a = "Да. Открытый код под MIT или Apache-2.0, без рекламы и без аккаунтов."
