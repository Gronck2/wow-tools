[[features]]
title = "Бэкапы"
text = '<code>WTF</code> (бинды, макросы, чат, CVars, настройки аддонов) и <code>Interface\AddOns</code> — после каждой игровой сессии или по расписанию.'

[[features]]
title = "Восстановление в один клик"
text = "На любую прошлую точку. Текущее состояние сначала сохраняется, так что восстановление всегда можно отменить."

[[features]]
title = "Обновление аддонов"
text = "Через менеджер, которым вы уже пользуетесь, — CurseForge, WowUp, WowUp-CF или Wago App: без окна, по расписанию и никогда во время игры. ElvUI — прямо с официального сайта."

[[features]]
title = "Патчи игры"
text = "Когда Battle.net обновляет игру, настройки и аддоны сохраняются до первого запуска новой версии, и видно, какие аддоны под неё ещё не обновлены."

[[features]]
title = "Профили интерфейса"
text = "Сохраните интерфейс персонажа — бинды, макросы, раскладку, аддоны и их профили — и поставьте его другому персонажу в два клика."

[[features]]
title = "Копирование между персонажами"
text = "Бинды, макросы, окна чата, расположение фреймов, включённые аддоны и их настройки — с одного персонажа на других."

[[features]]
title = "Уборка"
text = "Настройки удалённых аддонов, копии <code>.bak</code> от WoW, старые логи боя, скриншоты и кэш — с размерами, в один клик."

[[features]]
title = "Обновляется сам"
text = "Раз в день проверяет GitHub и ставит новую версию в один клик. Каждая загрузка сверяется с её SHA-256."

[[features]]
title = "Пять языков"
text = "Русский, английский, немецкий, французский и испанский. Следует светлой или тёмной теме Windows и её акцентному цвету."

