<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · WoW Tools</title>
<meta name="theme-color" content="#170e09">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
<script>
// GitHub Pages paths are case-sensitive: /RU/ or /Ru is a 404, so send it to the page it meant.
(function () {
  var path = location.pathname;
  var lower = path.toLowerCase();
  if (lower !== path) {
    location.replace(lower + location.search + location.hash);
  } else {
    var m = /^\/(ru|de|fr|es)(\/|$)/.exec(lower);
    if (m && lower !== "/" + m[1] + "/") location.replace("/" + m[1] + "/");
  }
})();
</script>
</head>
<body>
<div class="frame">

<header class="topbar">
<a class="brand" href="/"><img src="/favicon.ico" alt="" width="32" height="32">WoW Tools</a>
</header>

<main class="sheet">
<section aria-labelledby="title">
<h1 id="title">404</h1>
<p class="lede">This page does not exist.</p>
<div class="actions">
<a class="btn btn-primary" href="/">Home page</a>
<a class="btn btn-secondary" href="/ru/" hreflang="ru" lang="ru">Русский</a>
<a class="btn btn-secondary" href="/de/" hreflang="de" lang="de">Deutsch</a>
<a class="btn btn-secondary" href="/fr/" hreflang="fr" lang="fr">Français</a>
<a class="btn btn-secondary" href="/es/" hreflang="es" lang="es">Español</a>
</div>
</section>
</main>

</div>
</body>
</html>
