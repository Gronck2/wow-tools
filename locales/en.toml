[cli.profile]
about = "UI profiles: a character's interface saved under a name, to put on another character"

[cli.profile.save]
about = "Save a character's interface as a profile"
character = "Character: Realm/Name or ACCOUNT/Realm/Name"
flavor = "Game version: _retail_, _classic_, ..."

[cli.profile.list]
about = "List saved profiles"

[cli.profile.apply]
about = "Put a profile on a character (game closed; WTF is saved first)"
profile = "Profile number from `profile list`"
to = "Character: Realm/Name or ACCOUNT/Realm/Name"

[cli.profile.delete]
about = "Delete a profile"
profile = "Profile number from `profile list`"
