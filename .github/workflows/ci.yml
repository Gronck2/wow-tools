name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$v" "/DSourceExe=$PWD\target\release\wow-tools.exe" "/O$PWD\dist" packaging\installer.iss
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        with:
          name: wow-tools-${{ github.sha }}
          path: |
            target/release/wow-tools.exe
            dist/*-setup.exe
