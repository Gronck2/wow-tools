# Pushing a version tag (v1.2.3) builds WoW Tools from that commit in three forms and creates a draft
# GitHub release with them: the bare exe (what the app's self-update downloads), the installer and a
# portable zip. Each file gets a build provenance attestation (`gh attestation verify`). Review the
# notes and publish the draft by hand; winget.yml then sends the new version to winget.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Check the tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/WoW-Tools-$v.exe"
          Copy-Item target/release/wow-tools.exe $exe

          # Installer (Inno Setup is on the runner image).
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$v" "/DSourceExe=$PWD\target\release\wow-tools.exe" "/O$PWD\dist" packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = "dist/WoW-Tools-Setup-$v.exe"

          # Portable: the exe with portable.txt next to it, in a "WoW Tools" folder.
          $dir = "portable/WoW Tools"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/wow-tools.exe, packaging/portable.txt, LICENSE-MIT, LICENSE-APACHE $dir
          $zip = "dist/WoW-Tools-$v-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip

          "exe=$exe" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "${{ steps.package.outputs.exe }}", "${{ steps.package.outputs.setup }}", "${{ steps.package.outputs.zip }}"
          # The exe's line goes first: WoW Tools 0.2.x reads the first "SHA-256" of the notes.
          $notes = ($files | ForEach-Object {
            "SHA-256: ``$((Get-FileHash $_ -Algorithm SHA256).Hash)`` $(Split-Path $_ -Leaf)"
          }) -join "`n"
          # What changed: this version's section of CHANGELOG.md, required.
          $v = [regex]::Escape("${{ steps.version.outputs.version }}")
          $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$v\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) {
            Write-Error "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          }
          $notes = "$($m.Groups[1].Value.Trim())`n`n$notes"
          # GitHub lists assets by name and 0.2.x installs the first .exe: the bare exe must sort before
          # the installer (WoW-Tools-1.2.3.exe < WoW-Tools-Setup-1.2.3.exe).
          $exes = $files | Where-Object { $_ -like '*.exe' } | ForEach-Object { Split-Path $_ -Leaf } | Sort-Object
          if ($exes[0] -ne (Split-Path $files[0] -Leaf)) {
            Write-Error "The installer sorts before the exe: $($exes -join ', ')"
            exit 1
          }
          gh release create $env:GITHUB_REF_NAME $files --draft --verify-tag `
            --title "WoW Tools ${{ steps.version.outputs.version }}" --generate-notes --notes "$notes"
