# Publishes the landing page (site/) to GitHub Pages at https://wow-tool.gronck.com.
# The screenshots come from docs/images and the favicon from assets, so they are not kept twice.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - assets/wow-tools.ico
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp docs/images/*.png _site/img/
          cp assets/wow-tools.ico _site/favicon.ico
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
