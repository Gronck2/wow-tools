# Publishes the landing page (site/) to GitHub Pages at https://wow-tool.gronck.com.
# site/build.py renders a page per language and adds the screenshots from docs/images and the favicon from assets.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - assets/wow-tools.ico
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs as in GitHub's Pages starter workflows: in one job deploy-pages sometimes ran before the artifact uploaded
# a few seconds earlier was visible to the API ("No artifacts named github-pages").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 site/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
